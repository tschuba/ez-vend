[workspace]
members = [
    "crates/domain",
    "crates/storage",
    "crates/core",
    "crates/ui",
    "crates/app",
    "crates/launcher",
]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
authors = ["ez-vend-rs contributors"]
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/tschuba/ez-vend"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
sha2 = "0.10"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.7", features = ["v4", "serde", "js"] }

# Decimal (for currency)
rust_decimal = { version = "1.43", features = ["serde"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Async runtime
tokio = { version = "1.36", features = ["full"] }
futures = "0.3"

# Validation
validator = { version = "0.20", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Leptos framework
leptos = { version = "0.8", features = ["csr"] }
leptos_router = { version = "0.8" }
leptos_meta = { version = "0.8" }
# WASM
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Storage", "Window", "Navigator", "Clipboard", "AudioContext", "AudioDestinationNode", "AudioNode", "AudioParam", "AudioScheduledSourceNode", "BaseAudioContext", "GainNode", "OscillatorNode", "OscillatorType", "Blob", "BlobPropertyBag", "Document", "Element", "Event", "File", "FileList", "FilePropertyBag", "FileReader", "HtmlAnchorElement", "HtmlElement", "HtmlInputElement", "ProgressEvent", "StorageManager", "Url"] }
wasm-bindgen-futures = "0.4"
gloo-storage = "0.3"

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Enable Link Time Optimization
codegen-units = 1   # Better optimization, slower compile
panic = "abort"     # Smaller binary
strip = true        # Remove symbols
