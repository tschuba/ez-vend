[package]
name = "ez-vend-storage"
version.workspace = true
edition.workspace = true

[dependencies]
domain = { path = "../domain" }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
serde-wasm-bindgen = "0.6"

# WASM
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Navigator",
    "Storage",
    "Window",
    "IdbFactory",
    "IdbDatabase",
    "IdbObjectStore",
    "IdbTransaction",
    "IdbRequest",
    "IdbOpenDbRequest",
    "IdbCursor",
    "IdbKeyRange",
] }

# IndexedDB wrapper
rexie = "0.6"
idb = "0.6"

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Async
futures = { workspace = true }

# Date/Time
chrono = { workspace = true }

# UUID
uuid = { workspace = true }

# Decimal
rust_decimal = { workspace = true }

# SQLite parsing for legacy migration
rusqlite = { version = "0.39", features = ["serialize"] }

# Async trait
async-trait = "0.1"

# Logging
log = "0.4"

[dev-dependencies]
wasm-bindgen-test = "0.3"
rust_decimal_macros = "1.40"
