<!DOCTYPE html>
<html lang="de">
<head>
    <base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vend</title>
    <script>var p=new URLSearchParams(location.search).get('p');if(p)history.replaceState(null,null,p);</script>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="./icons/favicon-48.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="ez-vend">
    <link data-trunk rel="copy-file" href="manifest.webmanifest">
    <link data-trunk rel="copy-file" href="sw.js">
    <link data-trunk rel="copy-dir" href="assets/icons" target-path="icons">
    <link data-trunk rel="css" href="styles/app.css">
    
    <!-- Custom styles -->
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* CRITICAL: Print container spacing - applied universally to work in Safari print preview */
        .print-sales-section {
            margin: 0 !important;
            padding: 0 !important;
        }
        
        .print-sales-section h2 {
            margin: 0 !important;
            padding: 0 !important;
        }
        
        /* Print styles for vendor reports */
        @media print {
            /* Page setup - reduced margins for paper efficiency */
            @page {
                margin: 0.75cm;
                size: A4;
            }
            
            /* Remove padding from container in print */
            .print-reports-container {
                padding: 0 !important;
            }
            
            /* Each vendor report gets page break after to ensure next vendor starts on fresh page */
            .print-vendor-report {
                page-break-after: always;
                break-after: always;
                padding: 0.4cm;
            }
            
            /* Ink savings: Remove all backgrounds and use minimal borders */
            * {
                background: none !important;
                background-color: transparent !important;
                box-shadow: none !important;
            }

            /* CRITICAL: Hide screen view, show print view */
            .print\\:hidden {
                display: none !important;
            }
            
            .hidden.print\\:block {
                display: block !important;
            }
            
            /* Sales section wrapper - zero gap between heading and content */
            .print-sales-section {
                display: block !important;
                margin: 0 !important;
                padding: 0 !important;
                line-height: 1 !important;
            }
            
            .print-sales-section h2 {
                display: block !important;
                margin: 0 !important;
                padding: 0 !important;
                margin-bottom: 0 !important;
                padding-bottom: 0 !important;
            }
            
            /* Ensure h2 directly before container has no bottom margin */
            .print-vendor-report h2.mb-0 {
                margin-bottom: 0 !important;
                padding-bottom: 0 !important;
            }
            
            .print-items-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
                gap: 0.3rem;
                margin-bottom: 0.15rem;
            }
            
            .print-item {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 0.15rem 0.5rem;
                border: none;
                font-size: 0.75rem;
            }
            
            .print-item-amount {
                font-weight: 600;
                color: #000;
            }
        }
        
        /* CRITICAL: Hide print view on screen */
        @media screen {
            .hidden.print\\:block {
                display: none !important;
            }
            
            /* Add visual separator between reports for screen preview */
            .print-vendor-report {
                border-bottom: 2px dashed #ccc;
                padding-bottom: 2rem;
                margin-bottom: 2rem;
            }
            
            /* Add padding to container */
            .print-reports-container {
                padding: 2rem;
            }
            
            /* Screen preview of grid layout */
            .print-items-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
                gap: 0.25rem;
                margin-bottom: 0.25rem;
            }
            
            .print-item {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 0.25rem 0.5rem;
                background: #f9fafb;
                border: 1px solid #e5e7eb;
                border-radius: 0.25rem;
                font-size: 0.813rem;
            }
            
            .print-item-amount {
                font-weight: 600;
                color: #111827;
            }
        }
    </style>
</head>
<body>
    <noscript>Sie müssen JavaScript aktivieren, um diese Anwendung zu verwenden.</noscript>
    <div id="storage-warning-region" role="alert" aria-atomic="true"></div>
    <div id="app"></div>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('./sw.js')
                    .catch(function (err) { console.warn('SW registration failed:', err); });
            });
        }
    </script>
</body>
</html>
