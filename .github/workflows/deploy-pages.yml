name: Deploy Pages

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  push:
    branches:
      - main
    paths:
      - docs/**
      - .github/workflows/deploy-pages.yml
      - README.md

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Cancel in-progress docs deploys; never cancel a release deploy.
  cancel-in-progress: ${{ github.event_name != 'workflow_run' }}

jobs:
  build:
    name: Build Pages Site
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: docs
          destination: ./_site

      - name: Fix generated site ownership
        run: sudo chown -R "$USER":"$USER" _site

      - name: Restore WASM from latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/pos
          if gh release download --pattern "wasm-bundle.zip" --dir /tmp/wasm-dl; then
            unzip -q /tmp/wasm-dl/wasm-bundle.zip -d _site/pos
            sed -i 's|</head>|<meta name="router-base" content="/ez-vend-rs/pos">\n</head>|' _site/pos/index.html
          else
            echo "No wasm-bundle.zip found — /pos/ not included in this deploy."
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    name: Deploy Pages Site
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
