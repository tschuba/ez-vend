name: Dependency Update

on:
  schedule:
    - cron: "0 0 * * 1" # Every Monday at midnight
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  issues: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check-updates:
    name: Check for Updates
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-outdated
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-outdated

      - name: Check dependency freshness
        id: check
        shell: bash
        run: |
          # Use --exit-code 1 to fail when outdated dependencies are found
          if ! cargo outdated --workspace --exit-code 1 > outdated.txt; then
            echo "outdated=true" >> "$GITHUB_OUTPUT"
            {
              echo "REPORT<<EOF"
              cat outdated.txt
              echo "EOF"
            } >> "$GITHUB_ENV"
          else
            echo "outdated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Issue for Outdated Dependencies
        if: steps.check.outputs.outdated == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="Scheduled Dependency Update Check ($(date +%Y-%m-%d))"
          body="The following dependencies are outdated:

          \`\`\`
          ${{ env.REPORT }}
          \`\`\`

          Please review and update them as needed."

          # Check if an open issue with the same title prefix already exists to avoid duplicates
          existing_issue=$(gh issue list --search "$title" --state open --json number --jq '.[0].number')

          if [[ -z "$existing_issue" ]]; then
            # Ensure the label exists before using it
            gh label create "dependencies" --color "0075ca" --description "Dependency updates" --force || true
            gh issue create --title "$title" --body "$body" --label "dependencies"
          else
            echo "Issue already exists: #$existing_issue"
          fi
