name: Tag Release

# Fires on a direct push to main that changes Cargo.toml -- the squash-merge
# commit from a PR carries the version bump made by pr-version-bump.yml.
#
# The tag is pushed via deploy key so it triggers release.yml / deploy-pages.yml
# through their `push: tags` trigger (GITHUB_TOKEN tag pushes are suppressed).

on:
  push:
    branches:
      - main
    paths:
      - Cargo.toml

permissions:
  contents: write

jobs:
  tag:
    name: Create release tag
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Load deploy key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Detect version and push tag
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          curr_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -1)"

          if [[ -z "$curr_version" ]]; then
            echo "::error::Could not read workspace version from Cargo.toml"
            exit 1
          fi

          prev_version="$(git show "${BEFORE_SHA}:Cargo.toml" 2>/dev/null \
            | sed -n 's/^version = "\([^"]*\)"$/\1/p' | head -1 || echo '')"

          if [[ "$curr_version" == "$prev_version" ]]; then
            echo "Workspace version unchanged ($curr_version) — skipping tag."
            exit 0
          fi

          if [[ -n "$prev_version" ]]; then
            IFS='.' read -r prev_major prev_minor prev_patch <<< "$prev_version"
            IFS='.' read -r curr_major curr_minor curr_patch <<< "$curr_version"

            if (( curr_major < prev_major )) || \
               (( curr_major == prev_major && curr_minor < prev_minor )) || \
               (( curr_major == prev_major && curr_minor == prev_minor && curr_patch <= prev_patch )); then
              echo "::error::Workspace version regressed: ${prev_version} -> ${curr_version}. Refusing to tag a lower-or-equal version."
              exit 1
            fi
          fi

          echo "Version changed: ${prev_version:-<none>} → ${curr_version}"

          if git ls-remote --tags origin "refs/tags/v${curr_version}" | grep -q .; then
            echo "Tag v${curr_version} already exists — skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"
          git tag -a "v${curr_version}" -m "Release v${curr_version}"
          git push origin "v${curr_version}"
          echo "Tagged and pushed v${curr_version}"
