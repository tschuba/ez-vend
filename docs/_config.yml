title: ez-vend Documentation
description: Documentation for the ez-vend browser-based flea market booth management system.
remote_theme: just-the-docs/just-the-docs
color_scheme: light
url: https://tschuba.github.io
baseurl: /ez-vend
repository: tschuba/ez-vend
permalink: pretty
search_enabled: true
search.button: true
heading_anchors: true
back_to_top: true
back_to_top_text: Back to top
plugins:
  - jekyll-relative-links
  - jekyll-remote-theme
relative_links:
  enabled: true
  collections: true
aux_links:
  "ez-vend App":
    - https://tschuba.github.io/ez-vend/pos/
  GitHub Repository:
    - https://github.com/tschuba/ez-vend
aux_links_new_tab: true
footer_content: 'Published with GitHub Pages using just-the-docs.'
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
